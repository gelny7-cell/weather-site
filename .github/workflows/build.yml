# 3時間ごとに予報を取得してHTMLを作り直し、GitHub Pages に公開する
name: build-and-deploy

on:
  schedule:
    - cron: "15 */3 * * *"     # UTC。日本時間でも3時間ごと
    - cron: "0 11 * * 5"       # 金曜 20:00(日本時間)。スキー場の営業予定(オープン・クローズ)を見直す
  push:
    branches: [main]
  workflow_dispatch:            # 手動実行(Actions の画面から)

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python build.py
        env:                    # 金曜20時の回だけ、営業予定を SURF&SNOW で見直す
          PLAN_REFRESH: ${{ github.event.schedule == '0 11 * * 5' && '1' || '' }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  # 公開リポジトリは60日間コミットがないと定期実行が自動で止まるため、
  # 最後のコミットから30日たっていたら空のコミットを入れて止まらないようにする
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 30 * 24 * 3600 )) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "定期実行を止めないための空コミット"
            git push
          fi
