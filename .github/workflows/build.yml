# 3時間ごとに予報を取得してHTMLを作り直し、GitHub Pages に公開する
name: build-and-deploy

on:
  schedule:
    - cron: "15 */3 * * *"     # UTC。日本時間でも3時間ごと
  push:
    branches: [main]
  workflow_dispatch:            # 手動実行(Actions の画面から)

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
