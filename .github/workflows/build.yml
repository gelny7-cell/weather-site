# 日本時間 5・9・13・17・21時(4時間ごと、夜中は止める)に予報を取得してHTMLを作り直し、GitHub Pages に公開する
# Open-Meteo の無料枠(1日1万回)に収めるため1日5回(1回約1,950回 × 5 ≒ 9,800回)
name: build-and-deploy

on:
  schedule:
    - cron: "15 0,4,8,12,20 * * *"   # UTC。日本時間の 9:15・13:15・17:15・21:15・5:15
  push:
    branches: [main]
  workflow_dispatch:            # 手動実行(Actions の画面から)

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # 金曜17時の定期実行の回だけ、スキー場の営業予定(オープン・クローズ)を SURF&SNOW で見直す
      # (定期実行は遅れることがあるので、日本時間の金曜16〜20時に始まった回を対象にする)
      - run: |
          h=$(TZ=Asia/Tokyo date +%H); d=$(TZ=Asia/Tokyo date +%u)
          if [ "${{ github.event_name }}" = schedule ] && [ "$d" = 5 ] && [ "$h" -ge 16 ] && [ "$h" -le 20 ]; then export PLAN_REFRESH=1; fi
          python build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  # 公開リポジトリは60日間コミットがないと定期実行が自動で止まるため、
  # 最後のコミットから30日たっていたら空のコミットを入れて止まらないようにする
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 30 * 24 * 3600 )) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "定期実行を止めないための空コミット"
            git push
          fi
